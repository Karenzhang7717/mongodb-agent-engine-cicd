[project]
name = "movie-agent"
version = "0.1.0"
description = "Minimal agent hello-world starter template"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    # Atlas Agent Engine supplies SDK and runner wheels in the build runtime.
    # VM builds re-resolve dependencies. Platform runner 0.11.15 requires
    # protobuf >=6.33.6,<7; without this bound uv picks protobuf 7.x and
    # then fails to install the platform runtime wheels.
    "protobuf>=6.33.6,<7",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.1.12",
    "langchain-xai>=1.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-anthropic>=1.4.0",
    "pymongo>=4.20.0,<5",
]

[project.scripts]
movie-agent = "agent_movie_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_movie_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
