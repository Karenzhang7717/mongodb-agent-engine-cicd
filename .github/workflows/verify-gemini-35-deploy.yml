name: Verify Gemini 3.5 Flash-Lite on Agent Engine (one time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-gemini-35-deploy.yml

permissions:
  contents: read

jobs:
  build-deploy-invoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    concurrency:
      group: movie-agent-deploy
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.AGENTENGINE_PROJECT_ID }}
      WORKSPACE_ID: ${{ vars.AGENTENGINE_WORKSPACE_ID }}
      CLIENT_ID: ${{ secrets.AE_SA_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.AE_SA_CLIENT_SECRET }}
      SMOKE_TEST_NONCE: ${{ secrets.SMOKE_TEST_NONCE }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Gemini 3.5 agent, deploy, and verify Dune lookup
        shell: bash
        run: bash scripts/ci_deploy.sh
