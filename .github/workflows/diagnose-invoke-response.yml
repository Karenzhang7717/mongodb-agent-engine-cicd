name: Verify movie agent invocation after Gemini key sync (no rebuild)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-invoke-response.yml

permissions:
  contents: read

jobs:
  invoke-smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    env:
      PROJECT_ID: ${{ vars.AGENTENGINE_PROJECT_ID }}
      WORKSPACE_ID: ${{ vars.AGENTENGINE_WORKSPACE_ID }}
      CLIENT_ID: ${{ secrets.AE_SA_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.AE_SA_CLIENT_SECRET }}
      SMOKE_TEST_NONCE: ${{ secrets.SMOKE_TEST_NONCE }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing deployed agent with Dune database lookup
        shell: bash
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?}" "${WORKSPACE_ID:?}" "${CLIENT_ID:?}" "${CLIENT_SECRET:?}" "${SMOKE_TEST_NONCE:?}"
          ACCESS_TOKEN=$(curl --fail-with-body --silent --show-error \
            --user "$CLIENT_ID:$CLIENT_SECRET" \
            --data 'grant_type=client_credentials' \
            'https://agentengine.mongodb.com/api/v1/oauth/token' | jq -er '.access_token')
          export ACCESS_TOKEN PROJECT_ID WORKSPACE_ID SMOKE_TEST_NONCE
          echo "Verifying deployed Agent Engine invocation with unique seeded Dune marker (no build or redeploy)"
          python3 scripts/smoke_test.py
          echo "PASS: the running movie agent returned the exact seeded MongoDB movie marker"
