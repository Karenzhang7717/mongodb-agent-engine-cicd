name: Diagnose deployed agent invoke HTTP error (no rebuild)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-invoke-response.yml

permissions:
  contents: read

jobs:
  invoke-diagnostic:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    env:
      PROJECT_ID: ${{ vars.AGENTENGINE_PROJECT_ID }}
      WORKSPACE_ID: ${{ vars.AGENTENGINE_WORKSPACE_ID }}
      CLIENT_ID: ${{ secrets.AE_SA_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.AE_SA_CLIENT_SECRET }}
    steps:
      - name: Print sanitized response from one Dune invoke
        shell: bash
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?}" "${WORKSPACE_ID:?}" "${CLIENT_ID:?}" "${CLIENT_SECRET:?}"
          TOKEN=$(curl --fail-with-body --silent --show-error \
            --user "$CLIENT_ID:$CLIENT_SECRET" --data 'grant_type=client_credentials' \
            'https://agentengine.mongodb.com/api/v1/oauth/token' | jq -er '.access_token')
          RESPONSE="$RUNNER_TEMP/invoke-response.json"
          CODE=$(curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.agent-engine-2026-09-20-preview+json' \
            -H 'Content-Type: application/json' \
            -d '{"message":"Use lookup_movie to retrieve Dune from the database. Include the complete plot verbatim, including its test marker."}' \
            "https://agentengine.mongodb.com/api/v1/projects/$PROJECT_ID/workspaces/$WORKSPACE_ID/invoke")
          unset TOKEN
          echo "Invoke HTTP $CODE"
          python3 - "$RESPONSE" <<'PY'
          import json, re, sys
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          try: d=json.loads(raw)
          except json.JSONDecodeError:
              print("Non-JSON response; response length:",len(raw))
              raise SystemExit(0)
          print("Response field names:",sorted(d) if isinstance(d,dict) else type(d).__name__)
          if not isinstance(d,dict): raise SystemExit(0)
          fields=("success","status","code","error_code","error_type","message","error",
                  "reason","request_id","trace_id","execution_id","session_id")
          sensitive=re.compile(r'ae_sa_sk_|bearer |mongodb|sk-[A-Za-z0-9]{15,}',re.I)
          for k in fields:
              if k not in d: continue
              value=d[k]
              if isinstance(value,(dict,list)):
                  print(k+": type",type(value).__name__,"keys",
                        sorted(value)[:20] if isinstance(value,dict) else "list")
                  continue
              value=str(value)
              if sensitive.search(value):
                  print(k+": [REDACTED]")
              else:
                  print(k+":",value[:700])
          PY
          # For diagnostics, always complete successfully after reporting status.
